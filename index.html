<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bolsa de Valores GT — Simulador</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

 <div id="authOverlay" class="auth-overlay" style="display:none;">
  <div class="auth-panel">
    <div class="brand" style="margin-bottom:24px;">
      <span class="brand-name">BOLSA<span class="brand-accent">GT</span></span>
      <span class="brand-tag muted-mono">simulador</span>
    </div>

    <h2>Iniciar sesión</h2>
    <p class="muted small">Accede con tu correo y contraseña.</p>

    <label class="field-label">
      Correo institucional
      <input type="email" id="authEmail" class="field-input" autocomplete="email">
    </label>

    <label class="field-label">
      Contraseña
      <input type="password" id="authPassword" class="field-input" autocomplete="current-password">
    </label>

    <button id="authLogin" class="submit-btn amber full">Iniciar sesión</button>
    <button id="authRegister" class="reset-btn full" style="margin-top:8px;">Crear cuenta</button>
    <button id="forgotPassword" class="reset-btn" style="margin-top:8px;">¿Olvidaste tu contraseña?</button>

    <p id="authFeedback" class="feedback"></p>
  </div>
</div>


  <!-- Ticker tape -->
  <div class="ticker-tape">
    <div id="tickerTapeInner" class="ticker-tape-inner"></div>
  </div>

  <!-- Header / nav -->
  <header class="app-header">
    <div class="brand-nav">
      <div class="brand">
        <span class="brand-name">BOLSA<span class="brand-accent">GT</span></span>
        <span class="brand-tag muted-mono">simulador</span>
      </div>
      <nav class="main-nav">
        <button class="nav-btn active" data-view="dashboard">Mercado</button>
        <button class="nav-btn" data-view="options">Opciones Blitz</button>
        <button class="nav-btn" data-view="portfolio">Portafolio</button>
        <button class="nav-btn" data-view="history">Historial</button>
      </nav>
    </div>
    <div class="header-right">
      <div id="userBadge"></div>
      <button id="resetSimBtn" class="reset-btn" title="Reiniciar simulación">Reiniciar</button>
      <div class="conn-status"><span class="conn-dot"></span><span class="muted-mono">MERCADO EN VIVO</span></div>
    </div>
  </header>

  <main class="app-main">

    <!-- ===================== Vista: Mercado (Dashboard) ===================== -->
    <section id="view-dashboard" class="view active">
      <div class="dashboard-grid">
        <div class="panel watchlist-panel">
          <div id="watchlistTabs" class="wl-tabs"></div>
          <div id="watchlistList" class="wl-list"></div>
        </div>

        <div class="center-col">
          <div class="panel price-header">
            <div class="price-header-top">
              <h2 id="priceHeaderSymbol"></h2>
              <span id="priceHeaderName" class="muted"></span>
              <span class="mode-tag invest">Inversión · corto y largo plazo</span>
            </div>
            <div class="price-header-bottom">
              <span id="priceHeaderPrice" class="tabular big-price"></span>
              <span id="priceHeaderChange" class="tabular"></span>
              <span id="priceHeaderSpread" class="muted-mono small"></span>
            </div>
          </div>
          <div class="panel chart-panel">
            <canvas id="priceChart"></canvas>
          </div>
        </div>

        <div class="right-col">
          <div id="orderTicket" class="panel" data-side="buy" data-kind="market"></div>
          <div id="openOrders"></div>
        </div>
      </div>
    </section>

    <!-- ===================== Vista: Opciones (Blitz sube/baja) ===================== -->
    <section id="view-options" class="view">
      <div class="blitz-grid">
        <div class="panel watchlist-panel">
          <div id="blitzTabs" class="wl-tabs"></div>
          <div id="blitzList" class="wl-list"></div>
        </div>

        <div class="blitz-main">
          <div class="panel blitz-chart-panel">
            <div class="blitz-chart-header">
              <div class="price-header-top">
                <h2 id="blitzSymbol"></h2>
                <span id="blitzName" class="muted"></span>
                <span class="mode-tag blitz">Apuesta cronometrada</span>
              </div>
              <div class="price-header-bottom">
                <span id="blitzPrice" class="tabular big-price"></span>
                <span id="blitzChange" class="tabular"></span>
              </div>
            </div>
            <div class="blitz-canvas-wrap">
              <canvas id="blitzChart"></canvas>
            </div>
          </div>
          <div id="blitzOpenBets"></div>
        </div>

        <div id="blitzTicket" class="panel blitz-ticket"></div>
      </div>
    </section>

    <!-- ===================== Vista: Portafolio ===================== -->
    <section id="view-portfolio" class="view">
      <div id="portfolioKpis" class="kpi-grid"></div>
      <div id="positionsTable"></div>
    </section>

    <!-- ===================== Vista: Historial ===================== -->
    <section id="view-history" class="view">
      <div id="reportPanel"></div>
      <div id="historyFilters" class="chip-row"></div>
      <div id="historyTable"></div>
      <h3 class="section-subtitle">Operaciones Blitz (sube/baja)</h3>
      <div id="betsHistoryTable"></div>
    </section>

  </main>

  <!-- jsPDF + autotable (para el informe de inversión en PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <!-- Supabase (auth + base de datos) — solo se usa si js/config.js tiene credenciales -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/report.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/authUI.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
